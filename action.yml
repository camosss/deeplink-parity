name: deeplink-parity
description: Check that what your app declares about deep links matches what is actually hosted, on iOS and Android.
author: camosss

branding:
  icon: link
  color: blue

inputs:
  paths:
    description: >-
      Checkout paths to scan, whitespace separated. Pass one per platform when iOS and
      Android live in separate repositories.
    required: false
    default: '.'
  sha256:
    description: Android signing fingerprint to look for in assetlinks.json.
    required: false
  well-known:
    description: >-
      Read well-known files from <dir>/<domain>/ instead of the network. Use this to
      verify staged files, or to run with no egress.
    required: false
  config:
    description: >-
      Route config file passed to --config. By default deeplink-parity.yml is looked up
      in the working directory and each scanned path.
    required: false
  baseline:
    description: >-
      Baseline file passed to --baseline. By default deeplink-parity-baseline.json is
      looked up in the working directory and each scanned path; when found, the check
      fails only on findings that are not in it.
    required: false
  fail-on:
    description: >-
      When the step should fail — "error" (default), "warn" to also gate on warnings
      (route gaps, platform domain gaps), or "never" to report without blocking.
    required: false
    default: error
  version:
    description: Version of the npm package to run. Defaults to the version this tag ships with.
    required: false

outputs:
  errors:
    description: Number of error findings.
    value: ${{ steps.check.outputs.errors }}
  warnings:
    description: Number of warning findings.
    value: ${{ steps.check.outputs.warnings }}
  notices:
    description: Number of informational findings.
    value: ${{ steps.check.outputs.notices }}
  domains:
    description: Number of distinct domains checked.
    value: ${{ steps.check.outputs.domains }}
  report:
    description: Path to the JSON report.
    value: ${{ steps.check.outputs.report }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_SHA256: ${{ inputs.sha256 }}
        INPUT_WELL_KNOWN: ${{ inputs.well-known }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -o pipefail

        # The tag being used pins the version: read it from the package.json checked out
        # alongside this action, so a release never has to remember to bump it here.
        version="${INPUT_VERSION:-$(node -p "require('${GITHUB_ACTION_PATH}/package.json').version")}"
        report="${RUNNER_TEMP}/deeplink-parity.json"

        # A checkout of this repository that has been built runs its own code, which lets
        # CI exercise the action before anything is published. Consumers get the package.
        if [ -f "${GITHUB_ACTION_PATH}/dist/cli.js" ]; then
          cmd=(node "${GITHUB_ACTION_PATH}/dist/cli.js")
        else
          cmd=(npx --yes "deeplink-parity@${version}")
        fi

        args=()
        # whitespace-separated paths, split without glob expansion
        read -r -a input_paths <<< "$INPUT_PATHS"
        for p in "${input_paths[@]}"; do args+=("$p"); done
        [ -n "$INPUT_SHA256" ] && args+=(--sha256 "$INPUT_SHA256")
        [ -n "$INPUT_WELL_KNOWN" ] && args+=(--well-known "$INPUT_WELL_KNOWN")
        [ -n "$INPUT_CONFIG" ] && args+=(--config "$INPUT_CONFIG")
        [ -n "$INPUT_BASELINE" ] && args+=(--baseline "$INPUT_BASELINE")
        args+=(--fail-on "$INPUT_FAIL_ON")

        set +e
        "${cmd[@]}" "${args[@]}" --output "$report"
        status=$?
        set -e

        if [ -f "$report" ]; then
          for key in error warn info domains; do
            value=$(node -e "console.log(require('$report').summary['$key'] ?? 0)")
            case "$key" in
              error) echo "errors=$value"   >> "$GITHUB_OUTPUT" ;;
              warn)  echo "warnings=$value" >> "$GITHUB_OUTPUT" ;;
              info)  echo "notices=$value"  >> "$GITHUB_OUTPUT" ;;
              domains) echo "domains=$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done
          echo "report=$report" >> "$GITHUB_OUTPUT"
        fi

        # the fail-on policy is applied by the CLI itself; exit 2 (run failure) still fails
        exit "$status"
