# Daily deep-link check.
#
# This is the workflow that matters. Deep-link configuration breaks from outside your
# repo — a web deploy, an expired domain, a rotated signing key — so a pull-request
# check never sees it. This one runs whether or not anyone committed.
#
# Copy to .github/workflows/deeplink-parity.yml

name: deeplink-parity

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check deep link parity
        id: check
        run: npx deeplink-parity . --sha256 "${{ secrets.ANDROID_SHA256 }}"

      - name: Open an issue when the check fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Deep links are broken'
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deeplink-parity',
            })
            // one open issue at a time — a daily job must not file a duplicate every day
            if (open.length > 0) return
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['deeplink-parity'],
              body: `The scheduled deep-link check failed.\n\n[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            })
